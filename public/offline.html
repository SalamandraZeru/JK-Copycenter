<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2b5c">
    <title>Sem conexão | JK Copycenter</title>
    <style>
      body { margin: 0; min-width: 320px; background: #e8f1fa; color: #13233b; font-family: Arial, Helvetica, sans-serif; }
      main { box-sizing: border-box; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      section { max-width: 480px; border: 1px solid #b7d0e8; border-radius: 16px; background: #fff; padding: 32px; text-align: center; box-shadow: 0 12px 28px rgba(13, 43, 92, .12); }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { color: #0d2b5c; font-size: 1.5rem; }
      p { line-height: 1.6; }
      a { display: inline-block; min-height: 44px; box-sizing: border-box; border-radius: 8px; background: #0d2b5c; color: #fff; padding: 13px 20px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <img src="/icons/icon-192.png" alt="Monograma JK">
        <h1>Você está sem conexão</h1>
        <p>Reconecte-se para consultar informações atualizadas e finalizar um pedido. Nenhum pedido foi enviado enquanto você esteve offline.</p>
        <a href="/">Tentar novamente</a>
      </section>
    </main>
  </body>
</html>
